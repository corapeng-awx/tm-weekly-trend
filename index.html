      --filter-active: #3987e5;
      --filter-active-text: #ffffff;
      color-scheme: dark;

    --surface: #1a1a19;

  * { margin: 0; padding: 0; box-sizing: border-box; }

  .updated { color: var(--text-muted); font-size: 0.75rem; margin-bottom: 1.25rem; }

  /* Date filter */
  .filter-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
  .filter-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .filter-btn { padding: 0.3rem 0.75rem; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text-secondary); font-size: 0.75rem; cursor: pointer; font-family: inherit; transition: all 0.1s; }
  .filter-btn:hover { border-color: var(--text-muted); }
  .filter-btn.active { background: var(--filter-active); color: var(--filter-active-text); border-color: var(--filter-active); }
  .filter-sep { width: 1px; height: 1.25rem; background: var(--border); margin: 0 0.25rem; }

  /* KPI Row */
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
  .kpi { padding: 1rem 1.25rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .kpi-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.25rem; }
  .kpi-value { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
  .kpi-meta { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.375rem; font-size: 0.75rem; }
  .kpi-delta { font-weight: 600; }
  .kpi-delta.good { color: var(--delta-good); }
  .kpi-delta.bad { color: var(--delta-bad); }
  .kpi-target { color: var(--text-muted); }

  /* Section */
  .section { margin-bottom: 2.5rem; }
  .section-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem; }

  /* Chart cards */
  .charts-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; margin-bottom: 2.5rem; }
  .chart-card { padding: 1.25rem 1.25rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .chart-title { font-size: 0.875rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-primary); }
  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  .legend { display: flex; gap: 1.25rem; margin-top: 0.75rem; justify-content: center; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 0.375rem; font-size: 0.75rem; color: var(--text-secondary); }
  .legend-swatch { width: 12px; height: 3px; border-radius: 1px; flex-shrink: 0; }
  .legend-swatch.dashed { border-top: 2px dashed; background: none; height: 0; }

  /* Tables */
  .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
  thead { border-bottom: 1px solid var(--baseline); }
  th { text-align: left; padding: 0.625rem 0.75rem; font-weight: 600; font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); white-space: nowrap; }
  th.r { text-align: right; }
  td { padding: 0.5rem 0.75rem; border-top: 1px solid var(--gridline); white-space: nowrap; color: var(--text-secondary); }
  td.r { text-align: right; }
  td.delta-good { color: var(--delta-good); font-weight: 500; }
  td.delta-bad { color: var(--delta-bad); font-weight: 500; }
  tr.total-row td { font-weight: 600; border-top: 2px solid var(--baseline); color: var(--text-primary); }

  /* Insight boxes */
  .insight { background: var(--insight-bg); border-radius: 8px; padding: 1.25rem 1.5rem; margin-bottom: 2rem; }
  .insight-title { font-size: 0.8125rem; font-weight: 600; margin-bottom: 0.625rem; color: var(--text-primary); }
  .insight ul { list-style: none; padding: 0; }
  .insight li { font-size: 0.875rem; color: var(--text-secondary); line-height: 1.6; padding: 0.25rem 0 0.25rem 1rem; position: relative; }
  .insight li::before { content: ""; position: absolute; left: 0; top: 0.75rem; width: 4px; height: 4px; border-radius: 50%; background: var(--text-muted); }

  /* Tooltip */
  .tooltip { position: fixed; pointer-events: none; background: var(--text-primary); color: var(--surface); padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.75rem; line-height: 1.5; z-index: 100; opacity: 0; transition: opacity 0.12s; max-width: 240px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); }

  .tooltip-value { font-size: 1rem; font-weight: 700; }
  .tooltip-meta { font-size: 0.6875rem; opacity: 0.7; margin-top: 0.25rem; }

</style>

var filterWeeks = 0; // 0 = all

function setFilter(n) {
  filterWeeks = n;
  document.querySelectorAll(".filter-btn").forEach(function(b) {
    b.classList.toggle("active", parseInt(b.dataset.weeks) === n);
  });
  render();
}

function sliceData(arr, n) {
  if (n === 0 || n >= arr.length) return arr;
  return arr.slice(arr.length - n);
}

// Helpers
// ============================================================
var _mn = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function weekEnd(label) {
  var p = label.split(" ");
  var d = new Date(2026, _mn.indexOf(p[0]), parseInt(p[1]) + 6);
  return _mn[d.getMonth()] + " " + d.getDate();
}
function fmtPct(v) { return v == null ? "—" : (v < 1 ? v.toFixed(3) + "%" : v.toFixed(2) + "%"); }
function fmtNum(v) { return v == null ? "—" : v.toLocaleString("en-US"); }
function fmtMoney(v) { return "$" + v.toFixed(1) + "M"; }

function pctDelta(curr, prev) {
  if (curr == null || prev == null) return { text: "—", cls: "" };
  var d = curr - prev;
  var sign = d > 0.0001 ? "+" : d < -0.0001 ? "−" : "";
  var abs = Math.abs(d) < 0.01 ? Math.abs(d).toFixed(4) : Math.abs(d) < 0.1 ? Math.abs(d).toFixed(3) : Math.abs(d).toFixed(2);
  var cls = d > 0.0005 ? "bad" : d < -0.0005 ? "good" : "";
  return { text: sign + abs + "% WoW", cls: cls };
}

function countDelta(curr, prev) {
  if (curr == null || prev == null) return { text: "—", cls: "" };
  var d = curr - prev;
  var sign = d > 0 ? "+" : d < 0 ? "−" : "";
  var abs = Math.abs(d).toLocaleString("en-US");
  var cls = d > 0 ? "bad" : d < 0 ? "good" : "";
  return { text: sign + abs, cls: cls };
}

// ============================================================
// SVG Line Chart
// ============================================================
var NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  if (attrs) Object.keys(attrs).forEach(function(k) { e.setAttribute(k, attrs[k]); });
  return e;
}

function buildLineChart(containerId, cfg) {
  var series = cfg.series, xLabels = cfg.xLabels, yMax = cfg.yMax, yStep = cfg.yStep, targets = cfg.targets;
  var yFmt = cfg.yFmt || function(v) { return v === 0 ? "0" : v.toFixed(2) + "%"; };
  var valueFmt = cfg.valueFmt || fmtPct;
  var W = cfg.width || 700, H = cfg.height || 280;
  var P = { l: cfg.padLeft || 52, t: 20, r: 60, b: 40 };
  var pw = W - P.l - P.r, ph = H - P.t - P.b;
  var n = xLabels.length;

  var container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = "";

  var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, class: "chart", role: "img" });

  var nTicks = Math.round(yMax / yStep) + 1;
  for (var i = 0; i < nTicks; i++) {
    var v = +(i * yStep).toFixed(3);
    var y = P.t + ph - (v / yMax) * ph;
    svg.appendChild(svgEl("line", { x1: P.l, y1: y, x2: W - P.r, y2: y, stroke: "var(--gridline)", "stroke-width": 1 }));
    var txt = svgEl("text", { x: P.l - 8, y: y + 3.5, fill: "var(--text-muted)", "font-size": "10", "text-anchor": "end", "font-family": "system-ui, sans-serif" });
    txt.textContent = yFmt(v);
    svg.appendChild(txt);
  }
  svg.appendChild(svgEl("line", { x1: P.l, y1: P.t + ph, x2: W - P.r, y2: P.t + ph, stroke: "var(--baseline)", "stroke-width": 1 }));

  if (targets) {
    targets.forEach(function(t) {
      var ty = P.t + ph - (t.value / yMax) * ph;
      svg.appendChild(svgEl("line", { x1: P.l, y1: ty, x2: W - P.r, y2: ty, stroke: "var(--target-line)", "stroke-width": 1, "stroke-dasharray": "6 4" }));
      var lbl = svgEl("text", { x: W - P.r + 4, y: ty + 3.5, fill: "var(--text-muted)", "font-size": "9", "text-anchor": "start", "font-family": "system-ui, sans-serif" });
      lbl.textContent = t.label;
      svg.appendChild(lbl);
    });
  }

  xLabels.forEach(function(label, idx) {
    var x = n > 1 ? P.l + (idx / (n - 1)) * pw : P.l + pw / 2;
    var xt = svgEl("text", { x: x, y: P.t + ph + 20, fill: "var(--text-muted)", "font-size": "10", "text-anchor": "middle", "font-family": "system-ui, sans-serif" });
    xt.textContent = label;
    svg.appendChild(xt);
  });

  series.forEach(function(s) {
    var pts = [];
    s.values.forEach(function(val, idx) {
      if (val == null) return;
      pts.push({ x: n > 1 ? P.l + (idx / (n - 1)) * pw : P.l + pw / 2, y: P.t + ph - (val / yMax) * ph, v: val, i: idx });
    });
    if (pts.length < 2) return;

    var d = pts.map(function(p, j) { return (j === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1); }).join("");
    svg.appendChild(svgEl("path", { d: d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }));

    pts.forEach(function(p) { svg.appendChild(svgEl("circle", { cx: p.x, cy: p.y, r: 6, fill: "var(--surface)" })); });
    pts.forEach(function(p) {
      var dot = svgEl("circle", { cx: p.x, cy: p.y, r: 4, fill: s.color, class: "chart-dot" });
      dot.dataset.label = s.label; dot.dataset.week = xLabels[p.i]; dot.dataset.value = valueFmt(p.v);
      svg.appendChild(dot);
    });
    pts.forEach(function(p) {
      var hit = svgEl("circle", { cx: p.x, cy: p.y, r: 12, fill: "transparent", class: "chart-dot", style: "cursor:default" });
      hit.dataset.label = s.label; hit.dataset.week = xLabels[p.i]; hit.dataset.value = valueFmt(p.v);
      svg.appendChild(hit);
    });

    var last = pts[pts.length - 1];
    var elbl = svgEl("text", { x: last.x + 8, y: last.y + 4, fill: "var(--text-secondary)", "font-size": "11", "font-weight": "500", "text-anchor": "start", "font-family": "system-ui, sans-serif" });
    elbl.textContent = valueFmt(last.v);
    svg.appendChild(elbl);
  });

  container.appendChild(svg);
}

function roundedTopRect(x, y, w, h, r) {
  r = Math.min(r, h / 2, w / 2);
  return "M" + x + "," + (y + h) + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y + "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + "V" + (y + h) + "Z";
}

function buildStackedBarChart(containerId, cfg) {
  var data = cfg.data, yMax = cfg.yMax, yStep = cfg.yStep;
  var W = 500, H = 220;
  var P = { l: 48, t: 16, r: 12, b: 36 };
  var pw = W - P.l - P.r, ph = H - P.t - P.b;
  var n = data.length;
  var container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = "";
  var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, class: "chart", role: "img" });
  var nTicks = Math.round(yMax / yStep) + 1;
  for (var i = 0; i < nTicks; i++) {
    var v = i * yStep;
    var y = P.t + ph - (v / yMax) * ph;
    svg.appendChild(svgEl("line", { x1: P.l, y1: y, x2: W - P.r, y2: y, stroke: "var(--gridline)", "stroke-width": 1 }));
    var txt = svgEl("text", { x: P.l - 8, y: y + 3.5, fill: "var(--text-muted)", "font-size": "10", "text-anchor": "end", "font-family": "system-ui, sans-serif" });
    txt.textContent = v.toLocaleString();
    svg.appendChild(txt);
  }
  svg.appendChild(svgEl("line", { x1: P.l, y1: P.t + ph, x2: W - P.r, y2: P.t + ph, stroke: "var(--baseline)", "stroke-width": 1 }));
  var slotW = pw / n;
  var barW = Math.min(24, slotW * 0.6);
  var GAP = 2;
  data.forEach(function(d, idx) {
    var cx = P.l + (idx + 0.5) * slotW;
    var bx = cx - barW / 2;
    var baseY = P.t + ph;
    if (d.opsRfi != null) {
      var opsH = (d.opsRfi / yMax) * ph;
      var cvH = d.cv != null ? (d.cv / yMax) * ph : 0;
      var hasCv = cvH > 0.5;
      if (opsH > 0.5) {
        var el;
        if (hasCv) {
          el = svgEl("rect", { x: bx, y: baseY - opsH, width: barW, height: opsH, fill: "var(--series-1)" });
        } else {
          el = svgEl("path", { d: roundedTopRect(bx, baseY - opsH, barW, opsH, 4), fill: "var(--series-1)" });
        }
        el.classList.add("chart-dot"); el.dataset.label = "Ops RFI"; el.dataset.week = d.label; el.dataset.value = d.opsRfi.toLocaleString();
        svg.appendChild(el);
      }
      if (hasCv) {
        var cvY = baseY - opsH - GAP - cvH;
        var cp = svgEl("path", { d: roundedTopRect(bx, cvY, barW, cvH, 4), fill: "var(--series-2)" });
        cp.classList.add("chart-dot"); cp.dataset.label = "CV"; cp.dataset.week = d.label; cp.dataset.value = d.cv.toLocaleString();
        svg.appendChild(cp);
      }
    }
    var xt = svgEl("text", { x: cx, y: P.t + ph + 16, fill: "var(--text-muted)", "font-size": "9", "text-anchor": "middle", "font-family": "system-ui, sans-serif" });
    xt.textContent = d.label;
    svg.appendChild(xt);
  });
  container.appendChild(svg);

// Tooltip
// ============================================================
var tip = document.getElementById("tooltip");
document.addEventListener("pointerover", function(e) {
  if (!e.target.classList.contains("chart-dot") || !e.target.dataset.label) return;
  var t = e.target;
  tip.innerHTML = '<div class="tooltip-label">' + t.dataset.label + " · " + t.dataset.week + '</div><div class="tooltip-value">' + t.dataset.value + "</div>";
  tip.classList.add("visible");
});
document.addEventListener("pointermove", function(e) {
  if (!tip.classList.contains("visible")) return;
  var x = e.clientX + 12, y = e.clientY - tip.offsetHeight - 12;
  if (x + tip.offsetWidth > window.innerWidth - 12) x = e.clientX - tip.offsetWidth - 12;
  if (y < 12) y = e.clientY + 12;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
document.addEventListener("pointerout", function(e) {
  if (e.target.classList.contains("chart-dot")) tip.classList.remove("visible");
});

    series: [
      { label: "Overall", values: wa.map(function(w) { return w.overall; }), color: "var(--series-1)" },
      { label: "T2-T4 SME", values: wa.map(function(w) { return w.sme; }), color: "var(--series-2)" },
      { label: "Enterprise/T1", values: wa.map(function(w) { return w.enterprise; }), color: "var(--series-3)" }
    ],
    xLabels: wa.map(function(w) { return weekEnd(w.week); }),
    yMax: yMax1, yStep: yStep1,
    targets: [
      { value: DATA.targets.overall, label: "Target 0.70%" },
      { value: DATA.targets.sme, label: "Target 0.80%" }
    ]
  });

  // Fraud rate chart (YTD from fraudTrendFull)
  var ftf = DATA.fraudTrendFull;
  var fraudRateMax = 0;
  ftf.forEach(function(f) { fraudRateMax = Math.max(fraudRateMax, f.fraudRate, f.smeFraudRate || 0); });
  fraudRateMax = Math.max(fraudRateMax, DATA.targets.fraudSme) * 1.3;
  var frYMax = Math.ceil(fraudRateMax * 100) / 100;
  var frYStep = frYMax <= 0.15 ? 0.02 : 0.05;
  var ftfLabels = ftf.map(function(f, i) {
    var lbl = weekEnd(f.week);
    if (i === 0) return lbl;
    var prevMonth = weekEnd(ftf[i - 1].week).split(" ")[0];
    var thisMonth = lbl.split(" ")[0];
    return thisMonth !== prevMonth ? lbl : "";
  });
  buildLineChart("chart-fraud-rate", {
    series: [
      { label: "Overall", values: ftf.map(function(f) { return f.fraudRate; }), color: "var(--series-1)" },
      { label: "T2-T4 SME", values: ftf.map(function(f) { return f.smeFraudRate; }), color: "var(--series-2)" },
      { label: "Enterprise/T1", values: ftf.map(function(f) { return f.entFraudRate; }), color: "var(--series-3)" }
    ],
    xLabels: ftfLabels,
    yMax: frYMax, yStep: frYStep,
    targets: [
      { value: DATA.targets.fraudOverall, label: "Target " + DATA.targets.fraudOverall.toFixed(2) + "%" },
      { value: DATA.targets.fraudSme, label: "Target " + DATA.targets.fraudSme.toFixed(2) + "%" }
    ]
  });

  // Segment stacked bar charts: Ops RFI + CV
  var entBarData = ws.filter(function(s) { return s.entOpsRfis != null; }).map(function(s) {
    return { label: weekEnd(s.week), opsRfi: s.entOpsRfis, cv: s.entCvHits };
  });
  var smeBarData = ws.filter(function(s) { return s.smeOpsRfis != null; }).map(function(s) {
    return { label: weekEnd(s.week), opsRfi: s.smeOpsRfis, cv: s.smeCvHits };
  });
  var entMax = 0; entBarData.forEach(function(d) { entMax = Math.max(entMax, (d.opsRfi || 0) + (d.cv || 0)); });
  var entYMax = Math.ceil(entMax * 1.15 / 100) * 100;
  var entYStep = entYMax <= 300 ? 50 : entYMax <= 600 ? 100 : 200;
  var smeMax = 0; smeBarData.forEach(function(d) { smeMax = Math.max(smeMax, (d.opsRfi || 0) + (d.cv || 0)); });
  var smeYMax = Math.ceil(smeMax * 1.15 / 500) * 500;
  var smeYStep = smeYMax <= 1500 ? 250 : 500;
  buildStackedBarChart("chart-ent-rficv", { data: entBarData, yMax: entYMax, yStep: entYStep });
  buildStackedBarChart("chart-sme-rficv", { data: smeBarData, yMax: smeYMax, yStep: smeYStep });

}

render();
</script>
